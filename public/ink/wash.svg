<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" fill="none">
  <defs>
    <filter id="wash" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="4" seed="23" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="42"/>
      <feGaussianBlur stdDeviation="17"/>
    </filter>

    <radialGradient id="inkA">
      <stop offset="0" stop-color="#7E918B" stop-opacity="0.26"/>
      <stop offset="0.55" stop-color="#71817B" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#66746F" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="inkB">
      <stop offset="0" stop-color="#D8D3C7" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#D8D3C7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g filter="url(#wash)">
    <ellipse cx="310" cy="260" rx="245" ry="175" fill="url(#inkA)"/>
    <ellipse cx="885" cy="585" rx="300" ry="210" fill="url(#inkA)" opacity="0.65"/>
    <ellipse cx="700" cy="180" rx="185" ry="130" fill="url(#inkB)"/>
  </g>
</svg>
