<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" fill="none">
  <defs>
    <linearGradient id="fadeUp" x1="900" y1="1000" x2="900" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D6D2C7" stop-opacity="0.26"/>
      <stop offset="0.48" stop-color="#C5C8C0" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#B9C3BE" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="riverFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9FB1AC" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#9FB1AC" stop-opacity="0.20"/>
      <stop offset="0.65" stop-color="#9FB1AC" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#9FB1AC" stop-opacity="0"/>
    </linearGradient>

    <filter id="rough" x="-20%" y="-30%" width="140%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.025" numOctaves="3" seed="11" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="13" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="0.75"/>
    </filter>

    <filter id="mist" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.01" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="22"/>
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <mask id="softMask">
      <rect width="1800" height="1000" fill="white"/>
      <ellipse cx="910" cy="440" rx="640" ry="355" fill="black" opacity="0.82"/>
    </mask>
  </defs>

  <!-- 遠山，保留中央大量留白 -->
  <g filter="url(#rough)" mask="url(#softMask)">
    <path d="M-120 840
      C70 700 180 640 330 690
      C440 730 505 585 610 630
      C720 682 790 795 890 775
      C1030 745 1100 590 1235 600
      C1375 612 1435 730 1530 690
      C1650 640 1740 690 1920 825
      L1920 1030 L-120 1030 Z"
      fill="url(#fadeUp)" opacity="0.85"/>

    <path d="M-90 905
      C95 785 220 748 340 790
      C450 826 540 706 655 745
      C760 780 845 890 965 850
      C1100 804 1190 705 1310 732
      C1435 758 1500 846 1600 820
      C1715 790 1800 842 1900 925
      L1900 1030 L-90 1030 Z"
      fill="#AEB4AE" opacity="0.11"/>
  </g>

  <!-- 左側山峰局部 -->
  <g filter="url(#rough)" opacity="0.26">
    <path d="M-40 820 C105 630 205 515 315 555 C415 592 470 730 540 808"
      stroke="#BDC0B7" stroke-width="19" stroke-linecap="round"/>
    <path d="M25 835 C155 695 235 640 330 676 C405 704 453 772 505 825"
      stroke="#87958F" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- 右側遠峰 -->
  <g filter="url(#rough)" opacity="0.20">
    <path d="M1280 795 C1380 610 1470 540 1560 590 C1640 632 1695 735 1845 835"
      stroke="#C4C5BC" stroke-width="15" stroke-linecap="round"/>
  </g>

  <!-- 水面 -->
  <g opacity="0.48">
    <path d="M180 885 C420 850 700 908 955 880 C1160 858 1320 872 1580 915"
      stroke="url(#riverFade)" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M310 913 C510 895 700 930 900 912 C1120 892 1295 910 1495 937"
      stroke="url(#riverFade)" stroke-width="1.15" stroke-linecap="round"/>
    <path d="M520 943 C675 932 845 950 1010 940 C1170 931 1290 946 1390 957"
      stroke="url(#riverFade)" stroke-width="0.8" stroke-linecap="round"/>
  </g>

  <!-- 霧 -->
  <g filter="url(#mist)" opacity="0.22">
    <ellipse cx="405" cy="770" rx="250" ry="42" fill="#D2D4CC"/>
    <ellipse cx="1390" cy="745" rx="310" ry="48" fill="#C8D0CC"/>
  </g>
</svg>
